<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#e53935">
    <title>sea-click</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23e53935'/%3E%3Cpolygon points='38,28 38,72 72,50' fill='white'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23e53935'/%3E%3Cpolygon points='38,28 38,72 72,50' fill='white'/%3E%3C/svg%3E">
    <style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{width:100vw;height:100vh;min-height:-webkit-fill-available;overflow:hidden;display:flex;justify-content:center;align-items:center;user-select:none;-webkit-user-select:none;-moz-user-select:none}
body::selection{background:transparent}
.high-scores{position:fixed;top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:12px;padding:16px 20px;min-width:140px;max-width:45vw;z-index:10}
.high-scores-title{font-family:'Segoe UI',Tahoma,sans-serif;font-size:1.25rem;color:#fff;margin-bottom:12px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.high-scores-list{font-family:'Segoe UI',Tahoma,sans-serif;font-size:.95rem;color:#fff;padding-right:20px;line-height:1.6}
.high-scores-list li{display:flex;align-items:center;justify-content:space-between;gap:8px}
.high-scores-list .score-entry{flex:1}
.high-scores-list .score-delete{background:rgba(255,255,255,.2);border:none;color:#fff;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:1.2rem;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.high-scores-list .score-delete:hover{background:rgba(229,57,53,.8)}
.high-scores-list:empty::before{content:"אין שיאים עדיין";color:rgba(255,255,255,.7)}
.player-name-section{display:flex;flex-direction:column;align-items:center;gap:8px}
.player-name-section label{font-family:'Segoe UI',Tahoma,sans-serif;font-size:1rem;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.player-name-section input{font-family:'Segoe UI',Tahoma,sans-serif;font-size:16px;padding:12px 16px;border-radius:8px;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.9);min-width:180px;max-width:90vw;user-select:text}
.player-name-section input::placeholder{color:#999}
.player-name-section input.error{border-color:#e53935}
.player-name-error{font-family:'Segoe UI',Tahoma,sans-serif;font-size:.9rem;color:#ffcdd2;margin-top:4px}
.player-name-error.hidden{display:none}
.background{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(to bottom,rgba(255,100,80,.4) 0%,rgba(255,150,100,.5) 20%,rgba(255,200,120,.6) 40%,rgba(100,150,220,.7) 70%,rgba(30,80,150,.9) 100%),url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;z-index:-1}
.start-screen{display:flex;flex-direction:column;align-items:center;gap:24px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);transition:opacity .5s cubic-bezier(.4,0,.2,1),transform .5s cubic-bezier(.4,0,.2,1)}
.start-screen .play-button{opacity:0;animation:play-button-enter .6s cubic-bezier(.34,1.56,.64,1) both}
.start-screen .start-text{opacity:0;animation:play-button-enter .6s cubic-bezier(.34,1.56,.64,1) .1s both}
@keyframes play-button-enter{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.start-screen.hidden{opacity:0;transform:scale(.95);pointer-events:none}
.play-button{width:clamp(80px,22vw,120px);height:clamp(80px,22vw,120px);border-radius:50%;background:#e53935;border:none;cursor:pointer;display:flex;justify-content:center;align-items:center;box-shadow:0 6px 20px rgba(229,57,53,.5);transition:transform .2s ease,box-shadow .2s ease}
@media(hover:hover){.play-button:hover{transform:scale(1.05);box-shadow:0 8px 28px rgba(229,57,53,.6)}}
.play-button:active{transform:scale(.98)}
.play-triangle{width:0;height:0;border-top:min(28px,7vw) solid transparent;border-bottom:min(28px,7vw) solid transparent;border-right:min(44px,11vw) solid #fff;transform:translateX(-6px)}
.start-text{font-family:'Segoe UI',Tahoma,sans-serif;font-size:2.5rem;font-weight:700;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.countdown-screen,.results-screen{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px;cursor:pointer;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);transition:opacity .5s cubic-bezier(.4,0,.2,1),transform .5s cubic-bezier(.4,0,.2,1)}
.countdown-screen:not(.hidden),.results-screen:not(.hidden){animation:screen-enter .5s ease-out}
@keyframes screen-enter{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.countdown-screen.hidden,.results-screen.hidden{opacity:0;transform:scale(.98);pointer-events:none}
.candies-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.candy{position:absolute;left:0;top:0;font-size:2rem;will-change:transform;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.countdown-screen .countdown-number,.countdown-screen .clicks-during-countdown{position:relative;z-index:2}
.countdown-number{font-family:'Segoe UI',Tahoma,sans-serif;font-size:clamp(4rem,25vw,8rem);font-weight:700;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.5);animation:countdown-pulse 1s ease-in-out infinite}
@keyframes countdown-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.clicks-during-countdown{font-family:'Segoe UI',Tahoma,sans-serif;font-size:1.5rem;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.results-title{font-family:'Segoe UI',Tahoma,sans-serif;font-size:2.5rem;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.results-count{font-family:'Segoe UI',Tahoma,sans-serif;font-size:2rem;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5);animation:results-pop .5s cubic-bezier(.34,1.56,.64,1) .2s both}
@keyframes results-pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.results-hint{font-family:'Segoe UI',Tahoma,sans-serif;font-size:1rem;color:rgba(255,255,255,.8);text-shadow:0 1px 4px rgba(0,0,0,.5)}
@media(max-width:600px){.high-scores{padding:12px 16px;min-width:120px;max-width:55vw}.high-scores-title{font-size:1.1rem}.high-scores-list{font-size:.85rem}.start-text{font-size:2rem}.player-name-section{gap:6px}.clicks-during-countdown{font-size:1.25rem}.results-title{font-size:2rem}.results-count{font-size:1.5rem}.results-hint{font-size:.9rem}.candy{font-size:1.5rem}}
@media(hover:none) and (pointer:coarse){body{overscroll-behavior-y:contain}}
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="high-scores" id="highScores">
        <h3 class="high-scores-title">שיאים</h3>
        <ol class="high-scores-list" id="highScoresList"></ol>
    </div>
    <div class="start-screen" id="startScreen">
        <div class="player-name-section">
            <label for="playerName">שם שחקן:</label>
            <input type="text" id="playerName" list="playerNames" placeholder="הקלד שם או בחר מקיים">
            <datalist id="playerNames"></datalist>
            <p class="player-name-error hidden" id="playerNameError">יש לבחור או ליצור שחקן כדי להתחיל</p>
        </div>
        <button class="play-button" id="playButton" aria-label="התחלה"><span class="play-triangle"></span></button>
        <h1 class="start-text" id="startText">התחלה</h1>
    </div>
    <div class="countdown-screen hidden" id="countdownScreen">
        <div class="candies-container" id="candiesContainer"></div>
        <div class="countdown-number" id="countdownNumber">5.0</div>
        <div class="clicks-during-countdown">לחיצות: <span id="clickCount">0</span></div>
    </div>
    <div class="results-screen hidden" id="resultsScreen">
        <h2 class="results-title">סיימת!</h2>
        <div class="results-count">לחצת <span id="finalClickCount">0</span> פעמים</div>
        <p class="results-hint">יחזור להתחלה בעוד 5 שניות</p>
    </div>
    <audio id="bgMusic" loop preload="auto"><source src="https://www.orangefreesounds.com/wp-content/uploads/2021/02/Calm-relaxing-piano-music.mp3" type="audio/mpeg"></audio>
    <script>
const STORAGE_KEY='sunset-game-highscores',PLAYERS_KEY='sunset-game-players';
document.addEventListener('DOMContentLoaded',()=>{
const CANDIES=['🍬','🍭','🍫','🍪','🍩','🧁','🍰','🎂','🍦','🥧','🍡','🍫'];
const bgMusic=document.getElementById('bgMusic');
const playButton=document.getElementById('playButton'),startScreen=document.getElementById('startScreen'),countdownScreen=document.getElementById('countdownScreen'),resultsScreen=document.getElementById('resultsScreen'),countdownNumber=document.getElementById('countdownNumber'),clickCountEl=document.getElementById('clickCount'),finalClickCountEl=document.getElementById('finalClickCount'),playerNameInput=document.getElementById('playerName'),playerNameError=document.getElementById('playerNameError'),playerNamesDatalist=document.getElementById('playerNames'),highScoresList=document.getElementById('highScoresList');
let clickCount=0,countdownActive=!1,countdownInterval=null,candiesAnimationId=null,candies=[];
function getHighScores(){try{const d=localStorage.getItem(STORAGE_KEY);return d?JSON.parse(d):[]}catch{return[]}}
function getKnownPlayers(){try{const d=localStorage.getItem(PLAYERS_KEY);return d?JSON.parse(d):[]}catch{return[]}}
function saveHighScores(s){localStorage.setItem(STORAGE_KEY,JSON.stringify(s));renderHighScores()}
function addKnownPlayer(n){const t=n.trim();if(!t)return;const p=getKnownPlayers();if(!p.includes(t)){p.push(t);localStorage.setItem(PLAYERS_KEY,JSON.stringify(p));updatePlayerNamesDatalist()}}
function updatePlayerNamesDatalist(){playerNamesDatalist.innerHTML=getKnownPlayers().map(p=>`<option value="${p}">`).join('')}
function deletePlayer(n){saveHighScores(getHighScores().filter(e=>e.name!==n));localStorage.setItem(PLAYERS_KEY,JSON.stringify(getKnownPlayers().filter(p=>p!==n)));updatePlayerNamesDatalist()}
function renderHighScores(){const s=getHighScores(),o={};s.forEach(e=>{const n=o[e.name];if(!n||e.score>n)o[e.name]=e.score});const u=Object.entries(o).map(([n,s])=>({name:n,score:s})).sort((a,b)=>b.score-a.score).slice(0,10);highScoresList.innerHTML=u.map(e=>`<li><span class="score-entry">${e.name}: ${e.score}</span><button class="score-delete" data-name="${e.name.replace(/"/g,'&quot;')}" aria-label="מחק">×</button></li>`).join('');highScoresList.querySelectorAll('.score-delete').forEach(b=>{b.addEventListener('click',e=>{e.stopPropagation();confirm(`למחוק את ${b.dataset.name} מהשיאים?`)&&deletePlayer(b.dataset.name)})})}
function showScreen(s){startScreen.classList.add('hidden');countdownScreen.classList.add('hidden');resultsScreen.classList.add('hidden');s.classList.remove('hidden');s===startScreen?bgMusic.play().catch(()=>{}):bgMusic.pause()}
function startCandies(){const c=document.getElementById('candiesContainer');c.innerHTML='';candies=[];for(let i=0;i<15;i++){const e=document.createElement('div');e.className='candy';e.textContent=CANDIES[Math.floor(Math.random()*CANDIES.length)];e.style.fontSize=24+Math.random()*24+'px';const x=Math.random()*window.innerWidth,y=Math.random()*window.innerHeight;candies.push({el:e,x,y,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200});e.style.transform=`translate(${x}px,${y}px)`;c.appendChild(e)}
function animate(){const w=window.innerWidth,h=window.innerHeight;candies.forEach(c=>{c.x+=c.vx*.016;c.y+=c.vy*.016;if(c.x<0||c.x>w)c.vx*=-1;if(c.y<0||c.y>h)c.vy*=-1;c.x=Math.max(0,Math.min(w,c.x));c.y=Math.max(0,Math.min(h,c.y));c.el.style.transform=`translate(${c.x}px,${c.y}px)`});candiesAnimationId=requestAnimationFrame(animate)}animate()}
function stopCandies(){candiesAnimationId&&(cancelAnimationFrame(candiesAnimationId),candiesAnimationId=null);document.getElementById('candiesContainer').innerHTML='';candies=[]}
function startCountdown(){showScreen(countdownScreen);clickCount=0;clickCountEl.textContent='0';countdownActive=!0;startCandies();let t=50;countdownNumber.textContent=(t/10).toFixed(1);countdownInterval=setInterval(()=>{t--;countdownNumber.textContent=(t/10).toFixed(1);if(t<=0){clearInterval(countdownInterval);countdownActive=!1;stopCandies();showResults()}},100)}
function showResults(){finalClickCountEl.textContent=clickCount;showScreen(resultsScreen);const n=(playerNameInput.value||'שחקן').trim()||'שחקן';addKnownPlayer(n);const s=getHighScores(),i=s.findIndex(e=>e.name===n);i>=0?s[i].score=Math.max(s[i].score,clickCount):s.push({name:n,score:clickCount});const o={};s.forEach(e=>{const n=o[e.name];if(!n||e.score>n)o[e.name]=e.score});saveHighScores(Object.entries(o).map(([n,s])=>({name:n,score:s})).sort((a,b)=>b.score-a.score));setTimeout(returnToStart,5e3)}
function returnToStart(){showScreen(startScreen)}
const activePointers=new Set();
function handleGameTap(e){if(countdownActive&&activePointers.size===0)clickCount++,clickCountEl.textContent=clickCount;activePointers.add(e.pointerId)}
function handlePointerUp(e){activePointers.delete(e.pointerId)}
document.addEventListener('pointerdown',handleGameTap);
document.addEventListener('pointerup',handlePointerUp);
document.addEventListener('pointercancel',handlePointerUp);
function tryStartGame(){const n=playerNameInput.value.trim();if(!n)return playerNameError.classList.remove('hidden'),playerNameInput.classList.add('error'),playerNameInput.focus(),!1;playerNameError.classList.add('hidden');playerNameInput.classList.remove('error');startScreen.classList.add('hidden');startCountdown();return!0}
document.addEventListener('keydown',e=>{if(e.code!=='Space')return;countdownActive?(e.preventDefault(),clickCount++,clickCountEl.textContent=clickCount):document.activeElement!==playerNameInput&&(e.preventDefault(),!startScreen.classList.contains('hidden')&&tryStartGame())});
function startBgMusic(){bgMusic.play().catch(()=>{})}
playButton.addEventListener('click',e=>(e.stopPropagation(),startBgMusic(),tryStartGame()));
document.addEventListener('pointerdown',()=>startBgMusic(),{once:!0});
playerNameInput.addEventListener('input',()=>{playerNameInput.value.trim()&&(playerNameError.classList.add('hidden'),playerNameInput.classList.remove('error'))});
updatePlayerNamesDatalist();renderHighScores()});
    </script>
</body>
</html>
